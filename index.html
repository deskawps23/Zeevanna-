<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeevanna — Pelanggan &amp; Tim/Mitra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./bundle.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
      }
    </script>
  </head>
  <body>
    <div id="root" style="padding:16px;font-size:13px;color:#6b1d36;">Memuat bundle Zeevanna...</div>
    <script type="module">
      const showErr = (label, err) => {
        const root = document.getElementById("root");
        const detail = err && err.stack ? err.stack : String(err);
        if (root) {
          root.innerHTML =
            "<div style='background:#fffdfb;border:1px solid #dfd8d3;border-radius:16px;padding:14px;color:#2c2227;'>" +
            "<div style='font-weight:700;color:#6b1d36;margin-bottom:6px;'>" + label + "</div>" +
            "<pre style='white-space:pre-wrap;word-break:break-word;font-size:11px;margin:0;'>" + detail + "</pre>" +
            "</div>";
        }
      };

      window.addEventListener("error", (e) => {
        showErr("Window Error", e.error || e.message || e.filename);
      });
      window.addEventListener("unhandledrejection", (e) => {
        showErr("Unhandled Promise", e.reason);
      });

      (async () => {
        try {
          const ReactMod = await import("react");
          const ReactDOMClient = await import("react-dom/client");
          const React = ReactMod.default || ReactMod;
          globalThis.React = React;
          window.React = React;

          const AppMod = await import("./bundle.js");
          const createRoot = ReactDOMClient.createRoot;
          const App = AppMod.default;

          if (!App) {
            showErr("Export Error", "AppMod.default tidak ditemukan di ./bundle.js. Keys: " + Object.keys(AppMod).join(", "));
            return;
          }

          createRoot(document.getElementById("root")).render(
            React.createElement(React.StrictMode, null, React.createElement(App))
          );
        } catch (err) {
          showErr("Gagal Memuat Modul", err);
        }
      })();
    </script>
  </body>
</html>
