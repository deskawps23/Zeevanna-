<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeevanna Digital - Login</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Zeevanna Digital</h1>
            <p>Login untuk mulai menggunakan platform</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email" required />
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required />
                </div>

                <button type="submit" id="loginBtn">Login</button>
                <div id="errorMessage" style="color:red; margin-top:10px; display:none;"></div>
            </form>

            <p class="register-link">
                Belum punya akun? <a href="#" id="registerLink">Daftar</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
