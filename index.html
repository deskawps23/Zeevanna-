<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6C3CE1">
    <title>Zeevanna Digital - Platform Terintegrasi</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --primary-dark: #5B2FC9;
            --gradient: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            --bg: #f0f0f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(108, 60, 225, 0.12);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            padding-bottom: calc(80px + var(--safe-bottom));
            max-width: 480px;
            margin: 0 auto;
            color: var(--text);
            overflow-x: hidden;
        }
        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--gradient);
            padding: 20px 16px 30px;
            border-radius: 0 0 30px 30px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .header-top .brand {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-top .brand .badge-live {
            font-size: 9px;
            background: var(--success);
            padding: 2px 12px;
            border-radius: 50px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }
        .header-top .notif {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            position: relative;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header-top .notif .dot {
            position: absolute;
            top: 4px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid var(--primary);
            animation: pulse 1.5s infinite;
        }
        .header .greeting {
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }
        .header .sub {
            font-size: 13px;
            opacity: 0.8;
            position: relative;
            z-index: 2;
        }
        .header .role-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 12px;
            margin-top: 8px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(4px);
        }
        .header .location {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 16px;
            border-radius: 50px;
            display: inline-block;
            position: relative;
            z-index: 2;
        }
        /* ============================================================
           SALDO CARD
           ============================================================ */
        .saldo-card {
            background: var(--card);
            margin: -16px 16px 16px;
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 3;
            border: 1px solid rgba(108, 60, 225, 0.06);
        }
        .saldo-card .item {
            text-align: center;
            flex: 1;
            min-width: 50px;
        }
        .saldo-card .label {
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .saldo-card .value {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin-top: 2px;
        }
        .saldo-card .value.gold {
            color: var(--warning);
        }
        .saldo-card .value.green {
            color: var(--success);
        }
        /* ============================================================
           ROLE SWITCH
           ============================================================ */
        .role-switch {
            display: flex;
            gap: 8px;
            padding: 0 16px 14px;
            overflow-x: auto;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        .role-switch::-webkit-scrollbar {
            display: none;
        }
        .role-btn {
            padding: 8px 18px;
            border-radius: 50px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .role-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .role-btn:active {
            transform: scale(0.95);
        }
        /* ============================================================
           STATUS GRID
           ============================================================ */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 16px 16px;
        }
        .status-item {
            background: var(--card);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
        }
        .status-item:active {
            transform: scale(0.95);
        }
        .status-item.active {
            border-color: var(--primary);
            background: #f8f5ff;
        }
        .status-item .icon {
            font-size: 24px;
            display: block;
        }
        .status-item .label {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .status-item .count {
            font-size: 14px;
            font-weight: 800;
            color: var(--primary);
            margin-top: 2px;
        }
        /* ============================================================
           MENU GRID
           ============================================================ */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 16px 16px;
        }
        .menu-item {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 6px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.3s;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .menu-item:active {
            transform: scale(0.95);
            background: #f8f5ff;
            border-color: var(--primary);
        }
        .menu-item .icon {
            font-size: 26px;
            display: block;
        }
        .menu-item .label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            color: var(--text-secondary);
        }
        /* ============================================================
           SECTION
           ============================================================ */
        .section {
            padding: 0 16px 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title .badge {
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            padding: 2px 14px;
            border-radius: 50px;
            font-weight: 600;
        }
        /* ============================================================
           CHAT INTERFACE (Seperti TikTok/WhatsApp)
           ============================================================ */
        .chat-container {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .chat-container .msg {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .chat-container .msg .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            margin-right: 10px;
        }
        .chat-container .msg .bubble {
            background: #f3f4f6;
            padding: 10px 14px;
            border-radius: 14px 14px 14px 4px;
            max-width: 80%;
            font-size: 14px;
        }
        .chat-container .msg.own .bubble {
            background: var(--primary);
            color: #fff;
            border-radius: 14px 14px 4px 14px;
            margin-left: auto;
        }
        .chat-container .msg .bubble .time {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
        }
        .chat-container .msg.own .bubble .time {
            color: rgba(255, 255, 255, 0.7);
        }
        .chat-input {
            display: flex;
            gap: 10px;
            background: var(--card);
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e7eb;
        }
        .chat-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            font-family: inherit;
        }
        .chat-input button {
            background: var(--gradient);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .chat-input button:active {
            transform: scale(0.95);
        }
        .online-users {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            overflow-x: auto;
            flex-wrap: nowrap;
        }
        .online-users .user {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .online-users .user .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid var(--success);
            margin-bottom: 4px;
        }
        /* ============================================================
           GRAFIK / CHART (Blockchain Style)
           ============================================================ */
        .chart-container {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            margin-top: 10px;
        }
        .chart-container .chart-bar {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 150px;
            gap: 6px;
            padding: 10px 0;
        }
        .chart-container .chart-bar .bar {
            flex: 1;
            background: var(--gradient);
            border-radius: 6px 6px 0 0;
            min-height: 10px;
            max-height: 140px;
            transition: height 0.8s ease;
            position: relative;
        }
        .chart-container .chart-bar .bar .val {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .chart-container .chart-labels {
            display: flex;
            justify-content: space-around;
            font-size: 10px;
            color: var(--text-secondary);
            padding-top: 6px;
            border-top: 1px solid #f3f4f6;
        }
        .chart-container .chart-stats {
            display: flex;
            justify-content: space-between;
            padding: 10px 0 4px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chart-container .chart-stats .stat {
            text-align: center;
            flex: 1;
            min-width: 60px;
        }
        .chart-container .chart-stats .stat .num {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
        }
        .chart-container .chart-stats .stat .label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        /* ============================================================
           ORDER / TRANSAKSI
           ============================================================ */
        .order-card {
            background: var(--card);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border-left: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            transition: all 0.3s;
        }
        .order-card:active {
            transform: scale(0.98);
        }
        .order-card .info {
            flex: 2;
            min-width: 120px;
        }
        .order-card .info .name {
            font-weight: 700;
        }
        .order-card .info .desa {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .order-card .info .hash {
            font-size: 10px;
            color: var(--text-secondary);
            font-family: monospace;
            background: #f3f4f6;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 2px;
        }
        .order-card .status {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 50px;
        }
        .order-card .status.process {
            background: #dbeafe;
            color: #1e40af;
        }
        .order-card .status.pending {
            background: #fef3c7;
            color: #92400e;
        }
        .order-card .status.done {
            background: #d1fae5;
            color: #065f46;
        }
        .order-card .status.deliver {
            background: #d1fae5;
            color: #065f46;
        }
        .order-card .earning {
            font-weight: 700;
            color: var(--success);
            font-size: 15px;
        }
        /* ============================================================
           BUTTON WA
           ============================================================ */
        .btn-wa {
            display: block;
            background: #25D366;
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 50px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            margin: 12px 0;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.3);
            transition: all 0.3s;
        }
        .btn-wa:active {
            transform: scale(0.97);
        }
        /* ============================================================
           CONTACT GRID
           ============================================================ */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .contact-grid a {
            background: var(--card);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }
        .contact-grid a:active {
            background: #f8f5ff;
            border-color: var(--primary);
        }
        /* ============================================================
           REGISTER FORM
           ============================================================ */
        .register-form {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .register-form input,
        .register-form select {
            width: 100%;
            padding: 14px 16px;
