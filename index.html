  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6C3CE1; --primary-dark: #5B2FC9;
      --grad: linear-gradient(135deg, #6C3CE1 0%, #A78BFA 100%);
      --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --muted: #475569; --border: #E2E8F0;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 0 16px 88px; line-height: 1.5; }
    .wrap { max-width: 520px; margin: 0 auto; }
    .hdr { position: sticky; top: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 11px 0; margin-bottom: 16px; z-index: 20; }
    .hdr-in { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .brand { font-weight: 800; font-size: 1rem; color: var(--text); text-decoration: none; }
    .brand span { color: var(--primary); }
    .wa-pill { background: #7a1f2e; color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: 0 3px 14px rgba(15,23,42,0.04); }
    .badge { display: inline-block; background: #EDE9FE; color: var(--primary-dark); font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
    h1 { font-size: 1.55rem; font-weight: 800; margin-bottom: 6px; }
    h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
    .qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .qa a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 12px; background: #F8FAFC; border: 1px solid var(--border); text-decoration: none; color: var(--text); font-size: 0.75rem; font-weight: 700; }
    .qa i { color: var(--primary); }
    .fg { margin-bottom: 12px; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border); font-family: inherit; font-size: 0.9rem; background: #F8FAFC; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .btn { width: 100%; padding: 12px 16px; border-radius: 999px; border: none; background: var(--grad); color: #fff; font-weight: 700; font-size: 0.92rem; cursor: pointer; }
    .btn-sm { width: auto; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; }
    .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
    .step { padding: 6px 3px; border-radius: 8px; background: #F1F5F9; color: #64748B; font-size: 0.65rem; font-weight: 700; text-align: center; }
    .step.on { background: var(--grad); color: #fff; }
    .box { margin-top: 10px; padding: 11px; border-radius: 10px; background: #F1F5F9; font-size: 0.82rem; white-space: pre-wrap; }
    .sum { background: #F8FAFC; border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin-bottom: 12px; font-size: 0.84rem; }
    .line { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .tot { display: flex; justify-content: space-between; font-weight: 800; padding-top: 6px; border-top: 1px dashed #CBD5E1; color: var(--primary-dark); }
    .hist { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: #F8FAFC; font-size: 0.8rem; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 8px; display: flex; justify-content: space-around; z-index: 30; }
    .nav a { text-decoration: none; color: var(--muted); font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .nav i { color: var(--primary); }

    .svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    .svc-btn-on { background: var(--grad); color: #fff; }
    .svc-btn-soon { background: #E2E8F0; color: #475569; }
  
/* Audit UI: cegah teks terpotong & perjelas tombol aksi */
#driverForm p, #driverForm small, #driverForm .hint, #driverForm .msg {

<style id="zeevanna-palette-final">

    border-color: rgba(15, 36, 71, 0.14) !important;

  /* Badge / pill hijau muda & tosca */
  .badge, .pill, .tag, [class*="badge"], [class*="pill"], [class*="aktif"] {
    background-color: var(--hijau-muda) !important;
    color: var(--biru-navy) !important;
    border: 1px solid var(--hijau-tegas) !important;
    font-weight: 700;
  }

  /* Tombol aksi utama merah burgundy (menggantikan ungu lama) */
  button[type="submit"], .btn-primary, .btn-burgundy,

  #btnLacak, [id*="lacak"], [class*="pesan-btn"],

    border: 1px solid var(--burgundy-gelap) !important;
  }
  button[type="submit"]:hover, .btn-primary:hover, #btnLacak:hover {
    background-color: var(--burgundy-gelap) !important;
  }

  /* Aksen tosca untuk ikon/link/batas aktif */
  a {
    color: var(--tosca) !important;
  }
  .tosca, [class*="tosca"] {
    color: var(--tosca) !important;
    border-color: var(--tosca-terang) !important;
  }

  /* Slide / panel geser hitam menyala */
  .slide, .drawer, .sidebar, .offcanvas, .modal-slide,
  [class*="slide"], [class*="drawer"], [class*="offcanvas"] {
    background-color: var(--hitam-nyala) !important;
    color: var(--putih-tulang) !important;
    border-color: var(--tosca-terang) !important;
    box-shadow: 0 0 0 1px var(--tosca-terang), 0 0 24px rgba(45, 212, 191, 0.35), 0 14px 36px rgba(5, 5, 5, 0.75) !important;
  }
  [class*="slide"] *, [class*="drawer"] *, [class*="offcanvas"] * {
    color: var(--putih-tulang);
  }

  /* Rapikan teks tahapan & cegah kata terpotong */
  p, small, span, div, label, li, .hint, .note, .msg,
  #driverForm p, #driverForm small, #driverForm .hint, #driverForm .msg {
    max-width: 100%;
    white-space: normal;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }

  .step, .tahap, [class*="step"], [class*="stage"] {
    font-size: 0.76rem;
    line-height: 1.25;
    overflow-wrap: normal;
    word-break: normal;
    hyphens: none;
    min-width: 0;
  }

  input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]),
  select,
  textarea {
    max-width: 100%;
    box-sizing: border-box;
    background-color: #ffffff !important;
    color: var(--biru-navy) !important;
    border: 1px solid rgba(15, 36, 71, 0.22) !important;
    border-radius: 10px;
  }

  #zeevanna-footer, footer {
    color: var(--biru-navy) !important;
    background-color: var(--putih-tulang) !important;
    border-top: 2px solid var(--tosca) !important;
  }
</style>
