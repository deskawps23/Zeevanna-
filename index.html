<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6C3CE1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Zeevanna Digital - Pandeglang</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --primary-dark: #5B2FC9;
            --gradient: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            --bg: #f5f5fa;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --shadow: 0 8px 30px rgba(108, 60, 225, 0.12);
            --radius: 20px;
            --radius-sm: 14px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: calc(80px + var(--safe-bottom));
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ============================================================
           HEADER PREMIUM
           ============================================================ */
        .header {
            background: var(--gradient);
            padding: 20px 20px 35px;
            border-radius: 0 0 35px 35px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .header-top .brand {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }
        .header-top .brand .badge-live {
            font-size: 9px;
            background: #22c55e;
            padding: 3px 12px;
            border-radius: 50px;
            animation: pulse 2s infinite;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }
        .header-top .notif {
            font-size: 20px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .header-top .notif:active {
            transform: scale(0.95);
        }
        .header-top .notif .dot {
            position: absolute;
            top: 4px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid #6C3CE1;
            animation: pulse 1.5s infinite;
        }
        .header .greeting {
            font-size: 18px;
            font-weight: 600;
            opacity: 0.95;
            margin-top: 12px;
            position: relative;
            z-index: 2;
        }
        .header .sub {
            font-size: 14px;
            opacity: 0.8;
            position: relative;
            z-index: 2;
            margin-top: 2px;
        }
        .header .role-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 18px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header .location-info {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 8px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.15);
            padding: 5px 16px;
            border-radius: 50px;
            display: inline-flex;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header .location-info .dot-loc {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        /* ============================================================
           SALDO CARD (Gojek Style)
           ============================================================ */
        .saldo-card {
            background: var(--card);
            margin: -20px 16px 20px;
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 3;
            border: 1px solid rgba(108, 60, 225, 0.06);
        }
        .saldo-card .item {
            text-align: center;
            flex: 1;
            min-width: 60px;
            padding: 4px 0;
        }
        .saldo-card .label {
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }
        .saldo-card .value {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin-top: 2px;
        }
        .saldo-card .value.green {
            color: #22c55e;
        }
        .saldo-card .value.gold {
            color: #f59e0b;
        }

        /* ============================================================
           ROLE SWITCH
           ============================================================ */
        .role-switch {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px;
            overflow-x: auto;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        .role-switch::-webkit-scrollbar {
            display: none;
        }
        .role-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            font-family: inherit;
        }
        .role-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.35);
            transform: scale(1.02);
        }
        .role-btn:active {
            transform: scale(0.95);
        }

        /* ============================================================
           STATUS GRID (TikTok/Shopee Style)
           ============================================================ */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 16px 16px;
        }
        .status-item {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 14px 8px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .status-item:active {
            transform: scale(0.95);
        }
        .status-item.active {
            border-color: var(--primary);
            background: #f8f5ff;
        }
        .status-item .icon {
            font-size: 26px;
            display: block;
        }
        .status-item .label {
            font-size: 10px;
            font-weight: 600;
            margin-top: 4px;
            color: #6b7280;
        }
        .status-item .count {
            font-size: 14px;
            font-weight: 800;
            color: var(--primary);
            margin-top: 2px;
        }

        /* ============================================================
           MENU GRID
           ============================================================ */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 16px 16px;
        }
        .menu-item {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 16px 8px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .menu-item:active {
            transform: scale(0.95);
            background: #f8f5ff;
            border-color: var(--primary);
        }
        .menu-item .icon {
            font-size: 28px;
            display: block;
        }
        .menu-item .label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            color: #6b7280;
        }

        /* ============================================================
           SECTION
           ============================================================ */
        .section {
            padding: 0 16px 24px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title .badge-count {
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            padding: 3px 16px;
            border-radius: 50px;
            font-weight: 600;
        }

        /* ============================================================
           ORDER CARD (Premium)
           ============================================================ */
        .order-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-left: 5px solid var(--primary);
            transition: all 0.3s;
        }
        .order-card:active {
            transform: scale(0.98);
        }
        .order-card .info {
            font-size: 14px;
            flex: 2;
            min-width: 120px;
        }
        .order-card .info .name {
            font-weight: 700;
            font-size: 15px;
        }
        .order-card .info .desa {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        .order-card .info .point-earn {
            font-size: 11px;
            color: #f59e0b;
            font-weight: 600;
            margin-top: 2px;
        }
        .order-card .info .distance {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }
        .order-card .status {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 50px;
        }
        .order-card .status.done {
            background: #d1fae5;
            color: #065f46;
        }
        .order-card .status.pending {
            background: #fef3c7;
            color: #92400e;
        }
        .order-card .status.process {
            background: #dbeafe;
            color: #1e40af;
        }
        .order-card .status.deliver {
            background: #d1fae5;
            color: #065f46;
        }
        .order-card .earning {
            font-weight: 700;
            color: #22c55e;
            font-size: 15px;
        }

        /* ============================================================
           BUTTON WA PREMIUM
           ============================================================ */
        .btn-wa {
            display: block;
            background: #25D366;
            color: #fff;
            padding: 18px;
            border: none;
            border-radius: 50px;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            margin: 12px 0;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.35);
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-wa:active {
            transform: scale(0.97);
        }

        /* ============================================================
           CONTACT GRID
           ============================================================ */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .contact-grid a {
            background: var(--card);
            border: 1px solid #e5e7eb;
            border-radius: var(--radius-sm);
            padding: 14px 8px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .contact-grid a:active {
            background: #f8f5ff;
            border-color: var(--primary);
            transform: scale(0.97);
        }

        /* ============================================================
           REGISTER FORM PREMIUM
           ============================================================ */
        .register-form {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .register-form input,
        .register-form select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius-sm);
            font-size: 15px;
            margin-bottom: 12px;
            font-family: inherit;
            background: #f8fafc;
            transition: all 0.3s;
            -webkit-appearance: none;
            color: var(--text);
        }
        .register-form input:focus,
        .register-form select:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.08);
        }
        .register-form .btn-register {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(108, 60, 225, 0.35);
            font-family: inherit;
        }
        .register-form .btn-register:active {
            transform: scale(0.97);
        }
        .register-form .geo-status {
            font-size: 13px;
            color: #22c55e;
            text-align: center;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #f0fdf4;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-weight: 500;
        }
        .register-form .geo-status .pulse-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        /* ============================================================
           EARNING CARD PREMIUM
           ============================================================ */
        .earning-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-top: 12px;
        }
        .earning-card .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .earning-card .row:last-child {
            border-bottom: none;
        }
        .earning-card .label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }
        .earning-card .value {
            font-weight: 700;
            font-size: 15px;
        }
        .earning-card .value.green {
            color: #22c55e;
        }
        .earning-card .value.gold {
            color: #f59e0b;
        }
        .progress-bar {
            height: 10px;
            background: #f3f4f6;
            border-radius: 50px;
            margin: 10px 0 12px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--gradient);
            border-radius: 50px;
            transition: width 1s ease;
        }

        /* ============================================================
           DESA GRID PREMIUM
           ============================================================ */
        .desa-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .desa-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
            transition: all 0.3s;
        }
        .desa-card:active {
            transform: scale(0.97);
        }
        .desa-card .name {
            font-weight: 700;
            font-size: 13px;
        }
        .desa-card .kurir {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }
        .desa-card .count {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }

            font-size:
